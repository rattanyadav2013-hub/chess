<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Real Time Multiplayer Chess</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0803;
            color: #ff9900;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .header-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 40px;
            text-transform: uppercase;
        }
        .coin-box {
            border: 1px solid #ff9900;
            border-radius: 20px;
            padding: 5px 20px;
            margin-top: 15px;
            font-size: 16px;
            background-color: rgba(255, 153, 0, 0.05);
        }
        .setup-panel {
            border: 1px solid #332211;
            background-color: rgba(20, 15, 10, 0.6);
            border-radius: 8px;
            padding: 30px;
            margin-top: 30px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .instruction-text {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .connection-id-display {
            font-size: 14px;
            color: #ff9900;
            margin-bottom: 25px;
        }
        .connection-id-display span {
            color: #ffcc66;
        }
        .input-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }
        .id-input {
            background-color: #1a120b;
            border: 1px solid #443322;
            color: #ffffff;
            padding: 10px 15px;
            font-family: inherit;
            border-radius: 4px;
            width: 220px;
            text-align: center;
        }
        .btn-connect {
            background-color: #ffcc00;
            border: none;
            color: #000000;
            font-weight: bold;
            padding: 10px 25px;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
        }
        .ad-container-wrapper {
            width: 100%;
            max-width: 468px;
            margin: 10px auto 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="header-title">P2P Multiplayer Chess</div>
    
    <div class="coin-box">🪙 Express Coins: 10</div>

    <div class="setup-panel">
        <div class="instruction-text">Share your ID with a friend or enter theirs below.</div>
        <div class="connection-id-display">Your Connection ID: <span id="peer-id">1b06e778-c58f-4710-a34a-9ee171f475d3</span></div>
        
        <div class="input-row">
            <input type="text" class="id-input" id="friend-id-input" placeholder="Enter Friend's ID">
            <button class="btn-connect" id="connect-btn">Connect & Play</button>
        </div>

        <div class="ad-container-wrapper">
            <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                <iframe data-aa='2438349' src='//acceptable.a-ads.com/2438349?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display:block; margin: auto;'></iframe>
            </div>
        </div>
    </div>

</body>
</html>
